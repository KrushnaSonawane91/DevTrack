{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h1>Create a DevTrack Account</h1>
    <p>Register to start managing your development issues.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </p>
</div>
{% endblock %}
