
{% extends "base.html" %}

{% block title %}Delete Issue | DevTrack{% endblock %}

{% block content %}
<div class="panel">
    <h2>Delete Issue</h2>
    <p>Are you sure you want to delete <strong>{{ issue.title }}</strong>?</p>
    <p class="muted">This action cannot be undone.</p>

    <form method="post" class="actions">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Yes, delete issue</button>
        <a class="btn btn-secondary" href="{% url 'issue_detail' issue.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
